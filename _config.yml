title: Dimitrios Tsarouchas
tagline: Adversary Emulation | AI Security Testing | Red Teaming
description: >-
  Security professional specialising in adversary emulation across hybrid AD/Entra 
  environments, AI security testing, and agentic AI red teaming. MITRE ATT&CK and 
  ATLAS-mapped testing, EDR/XDR evaluation, and C2 development.

url: "https://dimitriostsarouchas.tech"

baseurl: ""

lang: en
timezone: Europe/London

github:
  username: DimitriosTsarouchas

linkedin:
  username: dimitrios-tsarouchas

social:
  name: Dimitrios Tsarouchas
  email: dimitristsaroucha@gmail.com
  links:
    - https://github.com/DimitriosTsarouchas
    - https://www.linkedin.com/in/dimitrios-tsarouchas/

theme_mode: dark

avatar: /assets/img/avatar.jpg

toc: true
comments:
  active: ""

paginate: 10

analytics:
  google:
    id: ""

disqus:
  shortname: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

permalink: /posts/:title/

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

theme: jekyll-theme-chirpy
